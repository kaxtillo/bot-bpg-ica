name: Build APK Auditor BPG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El paquete 'tools' fue retirado del repositorio del SDK de Android; si no se
      # sobreescribe 'packages', setup-android intenta instalarlo y falla con
      # "Failed to find package 'tools'".
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Capacitor 6 compila con compileSdk 34.
      - name: Install SDK packages for Capacitor 6
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      # La firma se toma de un secreto del repositorio para que NO cambie entre
      # compilaciones: si cambia, el APK deja de poder instalarse sobre el anterior.
      # (Antes se usaba actions/cache y el caché caducó, generando una firma nueva.)
      - name: Restaurar keystore de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Firma: keystore del secreto (estable entre compilaciones)"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_B64: se genera una firma nueva y el APK no podrá instalarse sobre el anterior"
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA256:" || true

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auditor-bpg-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
