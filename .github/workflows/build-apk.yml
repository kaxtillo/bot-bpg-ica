name: Build APK Auditor BPG

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # El paquete 'tools' fue retirado del repositorio de Android SDK: si no se
      # sobreescribe 'packages', setup-android intenta instalarlo y falla con
      # "Failed to find package 'tools'". Con platform-tools basta para arrancar.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      # Capacitor 6 compila con compileSdk 34, por eso se instala explícitamente.
      - name: Install SDK packages for Capacitor 6
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          sdkmanager --list_installed | sed -n '1,25p'

      - name: Cache debug keystore (firma estable entre builds)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Keystore generado (primera vez)"
          else
            echo "Keystore restaurado del cache (misma firma)"
          fi

      - name: Install Capacitor
        run: npm install

      - name: Add Android platform
        run: npx cap add android && npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auditor-bpg-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
